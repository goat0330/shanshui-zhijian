name: Geospatial Preflight

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master", "develop", "integration/**"]

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ml.txt

      - name: Install unified dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt
          python -m pip check

      - name: Verify CRS stack
        run: |
          python - <<'PY'
          import pyproj
          import rasterio
          assert pyproj.CRS.from_epsg(4545).is_projected
          assert rasterio.crs.CRS.from_epsg(4545).is_projected
          print('EPSG:4545 CRS stack OK')
          PY

      - name: Verify imports without environment pollution
        run: |
          python - <<'PY'
          import apps.workbench_api.manifest_service
          import ml.data_adapter
          import ml.change_map
          import ml.water_change
          print('Critical imports OK')
          PY

      - name: Verify pytest collection
        run: python -m pytest --collect-only -q
