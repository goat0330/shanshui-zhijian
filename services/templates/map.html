<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山水智鉴 — 重庆水域地图</title>
<script src="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { width: 100%; height: 100%; }
  .layer-control { position: absolute; top: 10px; right: 10px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 10; font-size: 14px; }
  .layer-control label { display: block; margin: 4px 0; }
  .layer-control input { margin-right: 6px; }
  .title-bar { position: absolute; top: 10px; left: 10px; background: white; padding: 8px 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 10; font-size: 14px; font-weight: 600; }
  .honesty-badge { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #ffd700; padding: 4px 10px; border-radius: 4px; font-size: 11px; z-index: 10; }
</style>
</head>
<body>
<div class="title-bar">山水智鉴 V0 — 重庆朝天门两江交汇</div>
<div class="layer-control">
  <strong>图层</strong>
  <label><input type="checkbox" checked data-layer="t1"> T1 原始 (5月)</label>
  <label><input type="checkbox" data-layer="t2"> T2 原始 (6月)</label>
  <label><input type="checkbox" data-layer="water"> 水体掩膜</label>
  <label><input type="checkbox" data-layer="change"> 变化热力图</label>
</div>
<div class="honesty-badge">⚠ 算法候选 · 演练角色 · 非政府认定违法事件</div>
<div id="map"></div>

<script>
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap',
      },
    },
    layers: [{ id: 'osm', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 19 }],
  },
  center: [106.575, 29.565],
  zoom: 13,
});

// 加载 COG 图层 (通过 TiTiler)
const cogLayers = {
  t1: { url: '/api/v1/cog/tilejson.json?layer=s2_t1', visible: true },
  t2: { url: '/api/v1/cog/tilejson.json?layer=s2_t2', visible: false },
  water: { url: '/api/v1/cog/tilejson.json?layer=water_mask_t2', visible: false },
  change: { url: '/api/v1/cog/tilejson.json?layer=water_change_score', visible: false },
};

map.on('load', () => {
  Object.entries(cogLayers).forEach(([id, cfg]) => {
    map.addSource(id, { type: 'raster', tiles: [cfg.url], tileSize: 256 });
    map.addLayer({ id, type: 'raster', source: id, layout: { visibility: cfg.visible ? 'visible' : 'none' } });
  });
});

// 图层控制
document.querySelectorAll('.layer-control input').forEach(cb => {
  cb.addEventListener('change', () => {
    const layer = map.getLayer(cb.dataset.layer);
    if (layer) map.setLayoutProperty(cb.dataset.layer, 'visibility', cb.checked ? 'visible' : 'none');
  });
});

// 加载变化候选图斑
fetch('/api/v1/alerts')
  .then(r => r.json())
  .then(alerts => {
    const features = alerts.filter(a => a.geometry).map(a => ({
      type: 'Feature',
      geometry: a.geometry,
      properties: { alert_id: a.alert_id, category: a.category, confidence: a.confidence },
    }));
    if (features.length === 0) return;
    map.addSource('candidates', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features },
    });
    map.addLayer({
      id: 'candidates-fill',
      type: 'fill',
      source: 'candidates',
      paint: { 'fill-color': '#ff4444', 'fill-opacity': 0.4, 'fill-outline-color': '#ff0000' },
    });
    map.addLayer({
      id: 'candidates-line',
      type: 'line',
      source: 'candidates',
      paint: { 'line-color': '#ff0000', 'line-width': 2 },
    });
  });
</script>
</body>
</html>
