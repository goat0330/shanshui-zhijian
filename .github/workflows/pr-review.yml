name: PR Review — Ensemble Efficiency

on:
  pull_request:
    branches:
      - 'integration/**'
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ensemble-efficiency:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ml.txt

      - name: Identify owner from changed paths
        id: owner
        shell: bash
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(ml/|tests/test_ml_|tests/test_cycle311_regressions.py)'; then
            echo "owner=perception-agent-a" >> "$GITHUB_OUTPUT"
            echo "fallback=engineering-agent-b" >> "$GITHUB_OUTPUT"
            echo "checks=ml-tests" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED" | grep -qE '^(\.github/workflows/|scripts/|requirements-ml.txt|pyproject.toml)'; then
            echo "owner=engineering-agent-b" >> "$GITHUB_OUTPUT"
            echo "fallback=project-manager-agent-e" >> "$GITHUB_OUTPUT"
            echo "checks=ci-tests" >> "$GITHUB_OUTPUT"
          else
            echo "owner=project-manager-agent-e" >> "$GITHUB_OUTPUT"
            echo "fallback=engineering-agent-b" >> "$GITHUB_OUTPUT"
            echo "checks=pytest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install unified dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt
          python -m pip check

      - name: Generate deterministic geospatial fixtures
        if: steps.owner.outputs.checks == 'ml-tests' || steps.owner.outputs.checks == 'ci-tests'
        run: python -m ml.data.generate_test_rasters

      - name: Run ML tests
        if: steps.owner.outputs.checks == 'ml-tests' || steps.owner.outputs.checks == 'ci-tests'
        run: |
          python -m pytest \
            tests/test_ml_environment.py \
            tests/test_ml_b1.py \
            tests/test_ml_b2.py \
            tests/test_cycle311_regressions.py \
            -v --tb=short -x

      - name: Run repository tests
        if: steps.owner.outputs.checks == 'pytest'
        run: python -m pytest tests/ -v --tb=short -x --ignore=tests/test_pipeline.py

      - name: Comment PR summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          CHECKS: ${{ steps.owner.outputs.checks }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const summary = `## PR Review — Ensemble Efficiency\n\n**Owner**: ${process.env.OWNER}\n**Checks**: ${process.env.CHECKS}\n**Job**: ${process.env.JOB_STATUS}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });
