[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water-governance-agent"
version = "0.1.1"
description = "山水智鉴 — 智慧水域监管智能体"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "SQLAlchemy>=2.0",
    "requests>=2.28",
    "rio-cogeo>=5.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0,<3",
]
data = [
    "earthengine-api>=1.0,<2",
]
test = [
    "pytest>=8",
    "pytest-rerunfailures>=14",
    "httpx2>=2.0",
]
dev = [
    "pytest>=8",
    "pytest-rerunfailures>=14",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "ml*", "services*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ml: machine-learning tests",
    "geospatial: raster/CRS tests",
    "workbench: API/workbench tests",
    "e2e: end-to-end tests",
]
