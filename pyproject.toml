[project]
name = "water-governance-agent"
version = "0.1.0"
description = "山水智鉴 — 智慧水域监管智能体"
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "rio-cogeo>=5.0",
    "jinja2>=3.1",
    "python-multipart",
    "earthengine-api>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "pytest-rerunfailures",
    "playwright",
]
