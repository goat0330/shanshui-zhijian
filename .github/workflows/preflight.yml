name: Geospatial Preflight

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Verify pyproj CRS
        run: |
          python -c "
          import pyproj; crs = pyproj.CRS.from_epsg(4545); print(f'pyproj OK: {crs.to_wkt()[:60]}...')"

      - name: Verify rasterio CRS
        run: |
          python -c "
          import rasterio; crs = rasterio.crs.CRS.from_epsg(4545); print(f'rasterio OK: {crs}')"

      - name: Verify no PROJ pollution — pytest collection
        run: python -m pytest --collect-only -q
