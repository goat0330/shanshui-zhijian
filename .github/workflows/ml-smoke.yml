name: ML Smoke

on:
  push:
    branches:
      - 'cycle3/engineering-agent-b'
      - 'feature/agent-b-*'
      - 'pr/agent-b-*'
    paths:
      - 'ml/**'
      - 'tests/test_ml_*.py'
      - 'requirements-ml.txt'
  pull_request:
    paths:
      - 'ml/**'
      - 'tests/test_ml_*.py'
      - 'requirements-ml.txt'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt
          pip install pytest rasterio scipy scikit-image

      - name: Smoke train with --seed 42
        run: |
          python -m ml.train --smoke --seed 42 --output-dir ml/output-ci

      - name: Verify manifest
        run: |
          python -c "
          import json
          with open('ml/output-ci/run_manifest.json') as f:
              data = json.load(f)
          assert data['status'] == 'succeeded', f'status={data[\"status\"]}'
          artifacts = [a['artifact_id'] for a in data['output_artifacts']]
          assert 'smoke_model' in artifacts, f'Missing smoke_model in {artifacts}'
          assert data.get('manifest_sha256'), 'Missing manifest_sha256'
          tc = data.get('tool_config', {})
          assert tc.get('metrics'), f'Missing metrics: {tc}'
          assert tc.get('seed') == 42, f'Seed mismatch: {tc.get(\"seed\")}'
          print(f'Manifest OK - run_id={data[\"run_id\"]} sha256={data[\"manifest_sha256\"][:16]}...')
          "

      - name: Run ML environment tests
        run: |
          python -m pytest tests/test_ml_environment.py -v --tb=short -x

      - name: Run ML-B1 tests (synthetic)
        run: |
          python -m pytest tests/test_ml_b1.py -v --tb=short -x -k "not rasters and not geotiff"

      - name: Run ML-B2 tests (synthetic change map)
        run: |
          python -m pytest tests/test_ml_b2.py -v --tb=short -x -k "ChangeMap or change_map or polygonize"

      - name: Reproducibility check
        run: |
          python -m ml.train --smoke --seed 42 --output-dir ml/output-ci-2
          python -c "
          import torch
          s1 = torch.load('ml/output-ci/smoke_checkpoint.pt', map_location='cpu', weights_only=False)
          s2 = torch.load('ml/output-ci-2/smoke_checkpoint.pt', map_location='cpu', weights_only=False)
          ok = all((s1['model_state_dict'][k] == s2['model_state_dict'][k]).all() for k in s1['model_state_dict'])
          print(f'Deterministic weights: {ok}')
          assert ok, 'Model weights differ between runs with same seed'
          "

      - name: Synthetic RF training check
        run: |
          python -m ml.train --seed 42

      - name: Archive smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-smoke-output
          path: ml/output-ci/
