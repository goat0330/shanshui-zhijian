name: ML Smoke

on:
  push:
    branches:
      - 'cycle3/engineering-agent-b'
      - 'feature/agent-b-*'
      - 'pr/agent-b-*'
      - 'integration/**'
    paths:
      - 'ml/**'
      - 'core/schemas/**'
      - 'apps/workbench_api/**'
      - 'tests/test_ml_*.py'
      - 'tests/test_cycle311_regressions.py'
      - 'requirements-ml.txt'
      - 'pyproject.toml'
      - '.github/workflows/ml-smoke.yml'
  pull_request:
    paths:
      - 'ml/**'
      - 'core/schemas/**'
      - 'apps/workbench_api/**'
      - 'tests/test_ml_*.py'
      - 'tests/test_cycle311_regressions.py'
      - 'requirements-ml.txt'
      - 'pyproject.toml'
      - '.github/workflows/ml-smoke.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ml.txt

      - name: Install unified dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt
          python -m pip check

      - name: Generate deterministic geospatial fixtures
        run: python -m ml.data.generate_test_rasters

      - name: Smoke train with --seed 42
        run: python -m ml.train --smoke --seed 42 --output-dir ml/output-ci

      - name: Verify smoke manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('ml/output-ci/run_manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'succeeded', data
          artifacts = [a['artifact_id'] for a in data['output_artifacts']]
          assert 'smoke_model' in artifacts, artifacts
          assert data.get('manifest_sha256')
          assert data.get('tool_config', {}).get('seed') == 42
          print('Manifest OK:', data['run_id'])
          PY

      - name: Run ML regression suite
        run: |
          python -m pytest \
            tests/test_ml_environment.py \
            tests/test_ml_b1.py \
            tests/test_ml_b2.py \
            tests/test_cycle311_regressions.py \
            -v --tb=short -x

      - name: Reproducibility check
        run: |
          python -m ml.train --smoke --seed 42 --output-dir ml/output-ci-2
          python - <<'PY'
          import torch
          s1 = torch.load('ml/output-ci/smoke_checkpoint.pt', map_location='cpu', weights_only=False)
          s2 = torch.load('ml/output-ci-2/smoke_checkpoint.pt', map_location='cpu', weights_only=False)
          assert all((s1['model_state_dict'][k] == s2['model_state_dict'][k]).all() for k in s1['model_state_dict'])
          print('Deterministic weights: True')
          PY

      - name: Synthetic RF training check
        run: python -m ml.train --seed 42 --output-dir ml/output-rf-ci

      - name: Archive ML outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-smoke-output
          path: |
            ml/output-ci/
            ml/output-rf-ci/
          if-no-files-found: warn
