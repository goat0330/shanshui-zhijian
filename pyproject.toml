[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "water-governance-agent"
version = "0.1.0"
description = "山水智鉴 — 智慧水域监管智能体"
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "rio-cogeo>=5.0",
    "jinja2>=3.1",
    "python-multipart",
    "earthengine-api>=1.0",
    "SQLAlchemy>=2.0",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["core*", "ml*", "apps*", "services*", "competition*", "tools*", "tests*"]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "earthengine-api>=1.0",
]
geospatial = [
    "fiona",
    "geopandas",
    "shapely",
    "pyproj",
]
workbench = [
    "SQLAlchemy>=2.0",
    "python-multipart",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8",
    "ruff",
    "pytest-rerunfailures",
    "playwright",
]

[tool.pytest.ini_options]
markers = [
    "unit: fast unit tests",
    "ml: requires ML dependencies",
    "geospatial: requires geospatial dependencies",
    "integration: requires database or external services",
    "real_data: requires real data files",
    "legacy: legacy contract tests awaiting rewrite",
]
