name: PR Review — Ensemble Efficiency

on:
  pull_request:
    branches:
      - 'integration/**'
      - develop
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: "3.11"

jobs:
  ensemble-efficiency:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Identify owner from changed paths
        id: owner
        shell: bash
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q "^ml/"; then
            echo "owner=perception-agent-a" >> $GITHUB_OUTPUT
            echo "fallback=engineering-agent-b" >> $GITHUB_OUTPUT
            echo "checks=ml-tests" >> $GITHUB_OUTPUT
          elif echo "$CHANGED" | grep -q "^.github/workflows/\|^scripts/\|requirements-ml.txt"; then
            echo "owner=engineering-agent-b" >> $GITHUB_OUTPUT
            echo "fallback=project-manager-agent-e" >> $GITHUB_OUTPUT
            echo "checks=ci-yaml" >> $GITHUB_OUTPUT
          elif echo "$CHANGED" | grep -q "^tests/"; then
            echo "owner=project-manager-agent-e" >> $GITHUB_OUTPUT
            echo "checks=pytest" >> $GITHUB_OUTPUT
          else
            echo "owner=project-manager-agent-e" >> $GITHUB_OUTPUT
            echo "checks=pytest" >> $GITHUB_OUTPUT
          fi

      - name: Run ensemble-efficiency gate
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD)
          TOTAL=$(echo "$CHANGED" | wc -l)
          echo "Changed files: $TOTAL"
          if [ -n "$CHANGED" ]; then
            echo "Processing changed files..."
            if echo "$CHANGED" | grep -q "^ml/train.py"; then
              echo "EFFICIENCY_CHECK: ml/train.py changed — verify train entry"
            fi
            if echo "$CHANGED" | grep -q "^ml/adapter.py\|^ml/model.py"; then
              echo "EFFICIENCY_CHECK: ModelAdapter changed — verify BaselineModel compatibility"
            fi
            if echo "$CHANGED" | grep -q "^.github/workflows/"; then
              echo "EFFICIENCY_CHECK: Workflow changed — verify CI config"
            fi
          fi

      - name: Install test deps
        if: steps.owner.outputs.checks != 'ci-yaml'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Run pytest (all)
        if: steps.owner.outputs.checks == 'pytest'
        run: python -m pytest tests/ -v --tb=short -x --ignore=tests/test_pipeline.py

      - name: Run ML tests
        if: steps.owner.outputs.checks == 'ml-tests'
        run: |
          python -m pip install -e ".[ml,dev]"
          python -m pytest tests/test_ml_environment.py -v --tb=short -x
          python -m pytest tests/test_ml_b1.py -v --tb=short -x -k "not rasters and not geotiff"
          python -m pytest tests/test_ml_b2.py -v --tb=short -x -k "ChangeMap or change_map or polygonize"

      - name: Comment PR summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, checks} = ${{ toJSON(steps.owner.outputs) }};
            const summary = `## PR Review — Ensemble Efficiency\n\n**Owner**: ${owner}\n**Checks**: ${checks}\n\nSee workflow logs for detailed efficiency gate results.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
